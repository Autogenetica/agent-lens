version: 1

environment:
  backend: docker
  dockerfile: ../Dockerfile
  resources:
    cpus: 2
    memory: 2GB
    storage: 5GB
  build_timeout: 10m
  network:
    mode: none

agent:
  name: oracle
  model: none
  timeout: 30m
  step_limit: 100
  cost_limit: 5.0
  exec_timeout: 300
  environment:
    network:
      mode: none

verifier:
  timeout: 10m
